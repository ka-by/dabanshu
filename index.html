<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CANNIKIN 遊戲站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0d12;
    --panel: rgba(8, 12, 18, 0.72);
    --line: rgba(255, 210, 120, 0.22);
    --amber: #f7a41d;
    --amber-soft: #ffd27a;
    --mint: #5ef0c8;
    --fog: #d7e0ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    color: var(--fog);
    font-family: "Noto Sans TC", sans-serif;
    background: var(--ink);
  }
  a { color: inherit; text-decoration: none; }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    align-items: end;
    overflow: hidden;
    isolation: isolate;
  }
  .hero-media {
    position: absolute;
    inset: 0;
    z-index: -2;
    background:
      linear-gradient(180deg, rgba(6, 8, 12, 0.25) 0%, rgba(6, 8, 12, 0.55) 48%, rgba(6, 8, 12, 0.92) 100%),
      url("assets/hero-entrance.png") center / cover no-repeat;
    transform: scale(1.06);
    animation: drift 18s ease-in-out infinite alternate;
  }
  .hero-grain {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(247, 164, 29, 0.18), transparent 42%),
      radial-gradient(ellipse at 80% 70%, rgba(94, 240, 200, 0.08), transparent 36%);
    mix-blend-mode: screen;
  }
  .hero-inner {
    width: min(1120px, calc(100% - 2.5rem));
    margin: 0 auto;
    padding: 0 0 4.5rem;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 0.85rem;
    margin-bottom: 1.4rem;
    opacity: 0;
    animation: rise 0.9s ease 0.15s forwards;
  }
  .brand img {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid #ff2a2a;
    box-shadow: 0 0 0 4px rgba(255, 42, 42, 0.12);
  }
  .brand-text {
    font-family: Orbitron, sans-serif;
    font-weight: 900;
    font-size: clamp(1.35rem, 3vw, 2rem);
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 24px rgba(247, 164, 29, 0.35);
  }
  .brand-text span { color: var(--amber); }
  .headline {
    max-width: 14ch;
    font-family: Orbitron, sans-serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 7vw, 4.8rem);
    line-height: 0.98;
    letter-spacing: 0.02em;
    color: #fff;
    opacity: 0;
    animation: rise 0.95s ease 0.28s forwards;
  }
  .lede {
    max-width: 34rem;
    margin-top: 1.1rem;
    font-size: clamp(1rem, 2.2vw, 1.15rem);
    line-height: 1.65;
    color: rgba(215, 224, 234, 0.86);
    opacity: 0;
    animation: rise 0.95s ease 0.42s forwards;
  }
  .cta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-top: 1.8rem;
    opacity: 0;
    animation: rise 0.95s ease 0.55s forwards;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 3.1rem;
    padding: 0.85rem 1.45rem;
    border-radius: 0.55rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary {
    color: #1c1203;
    background: linear-gradient(180deg, #ffe07a 0%, #f7a41d 55%, #d88a00 100%);
    box-shadow: 0 10px 28px rgba(247, 164, 29, 0.28);
  }
  .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-ghost {
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.28);
    background: rgba(10, 14, 20, 0.35);
    backdrop-filter: blur(8px);
  }
  .btn-ghost:hover { border-color: var(--amber-soft); }

  .section {
    width: min(1120px, calc(100% - 2.5rem));
    margin: 0 auto;
    padding: 4.5rem 0 5.5rem;
  }
  .section h2 {
    font-family: Orbitron, sans-serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    letter-spacing: 0.08em;
    margin-bottom: 0.55rem;
  }
  .section p.note {
    color: rgba(215, 224, 234, 0.68);
    margin-bottom: 1.8rem;
    max-width: 36rem;
    line-height: 1.6;
  }
  .game-link {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    gap: 1.4rem;
    align-items: stretch;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: 1rem;
    background:
      linear-gradient(135deg, rgba(247, 164, 29, 0.08), transparent 40%),
      var(--panel);
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .game-link:hover {
    border-color: rgba(247, 164, 29, 0.55);
    transform: translateY(-2px);
  }
  .game-copy { padding: 0.8rem 0.6rem 0.8rem 0.4rem; display: flex; flex-direction: column; justify-content: center; }
  .game-copy .tag {
    display: inline-block;
    width: fit-content;
    margin-bottom: 0.7rem;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    color: var(--mint);
    text-transform: uppercase;
  }
  .game-copy h3 {
    font-family: Orbitron, sans-serif;
    font-size: clamp(1.35rem, 3vw, 1.9rem);
    letter-spacing: 0.04em;
    margin-bottom: 0.55rem;
  }
  .game-copy p {
    color: rgba(215, 224, 234, 0.78);
    line-height: 1.65;
    margin-bottom: 1.1rem;
  }
  .game-copy .play {
    color: var(--amber-soft);
    font-weight: 800;
    letter-spacing: 0.08em;
  }
  .game-visual {
    min-height: 220px;
    border-radius: 0.75rem;
    background: url("assets/card-roof.png") center / cover no-repeat;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  footer {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 1.4rem 1.25rem 2rem;
    text-align: center;
    color: rgba(215, 224, 234, 0.45);
    font-size: 0.85rem;
    letter-spacing: 0.08em;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes drift {
    from { transform: scale(1.06) translate3d(0, 0, 0); }
    to { transform: scale(1.12) translate3d(-1.5%, -1%, 0); }
  }

  @media (max-width: 820px) {
    .game-link { grid-template-columns: 1fr; }
    .game-visual { min-height: 180px; order: -1; }
    .hero-inner { padding-bottom: 3.2rem; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-media" aria-hidden="true"></div>
    <div class="hero-grain" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="brand">
        <img src="assets/cannikin_logo.jpg" alt="CANNIKIN">
        <div class="brand-text">CANNIKIN <span>遊戲站</span></div>
      </div>
      <h1 class="headline">方塊世界，立刻開戰</h1>
      <p class="lede">瀏覽器就能玩的第一人稱射擊小站。先從《方塊突擊 RBMK-1000》開始，之後會陸續加上更多小遊戲。</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="/game/">立即遊玩</a>
        <a class="btn btn-ghost" href="#games">看看有什麼</a>
      </div>
    </div>
  </header>

  <main id="games" class="section">
    <h2>現正上線</h2>
    <p class="note">單機對戰 BOT，免安裝。建議使用電腦瀏覽器，鍵鼠操作體驗最好。</p>
    <a class="game-link" href="/game/">
      <div class="game-copy">
        <span class="tag">FPS · 10v10</span>
        <h3>方塊突擊 RBMK-1000</h3>
        <p>Minecraft 方塊風核電站地圖。殲滅、拆除、軍備競賽、天台對戰，你加 19 名電腦同場。</p>
        <span class="play">進入遊戲 →</span>
      </div>
      <div class="game-visual" role="img" aria-label="天台對戰場景"></div>
    </a>
  </main>

  <footer>CANNIKIN GAMING · 大番薯 · aBcDIQ180</footer>
</body>
</html>
